# Alembic configuration for Call Analysis
# The URL is overridden at runtime by src/call_analysis/alembic/env.py
# from the DB_* environment variables (see call_analysis.config.DatabaseSettings).

[alembic]
script_location = src/call_analysis/alembic
prepend_sys_path = src
# Leave blank — env.py substitutes settings.database.async_url
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
