receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
  prometheus:
    config:
      scrape_configs:
        - job_name: 'call-analysis-api'
          static_configs:
            - targets: ['api:8787']
        - job_name: 'call-analysis-worker'
          static_configs:
            - targets: ['worker:8787']
        - job_name: 'otel-collector'
          static_configs:
            - targets: ['otel-collector:8888']

exporters:
  prometheus:
    endpoint: "0.0.0.0:8888"
  logging:
    loglevel: debug

service:
  pipelines:
    traces:
      receivers: [otlp]
      exporters: [logging]
    metrics:
      receivers: [otlp, prometheus]
      exporters: [prometheus, logging]
    logs:
      receivers: [otlp]
      exporters: [logging]