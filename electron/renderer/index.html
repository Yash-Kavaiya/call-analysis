<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:" />
  <title>Starting Call Analysis…</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="splash">
    <div class="brand-mark" aria-hidden="true">
      <svg viewBox="0 0 64 64" width="84" height="84">
        <defs>
          <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#a6ff00" />
            <stop offset="1" stop-color="#4c6b00" />
          </linearGradient>
        </defs>
        <rect x="4" y="4" width="56" height="56" rx="14" fill="url(#g)" />
        <g stroke="#0b0f14" stroke-width="4" stroke-linecap="round">
          <path d="M14 36 l8 -12 l8 12 l8 -16 l8 16 l8 -10" fill="none" />
        </g>
      </svg>
    </div>

    <h1>Call Analysis</h1>
    <p class="tagline">NVIDIA Contact Center Intelligence</p>

    <div class="status-card">
      <div class="status-line">
        <span class="spinner" id="spinner" aria-hidden="true"></span>
        <span id="statusText">Starting the analysis engine…</span>
      </div>
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    </div>

    <pre id="log" class="log"></pre>

    <p class="hint">
      First launch may take a minute while models load.
      <a href="#" id="keyLink">Get a free NVIDIA API key</a>
    </p>
  </main>

  <script src="renderer.js"></script>
</body>
</html>
