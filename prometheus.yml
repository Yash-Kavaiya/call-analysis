global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'call-analysis'
    environment: 'production'

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel-collector:8888']

  - job_name: 'call-analysis-api'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['api:8787']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'api'

  - job_name: 'call-analysis-worker'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['worker:8787']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'worker'

  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres:5432']

  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['host.docker.internal:9100']

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files: []