version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: call-analysis-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-call_analysis}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
      POSTGRES_DB: ${DB_NAME:-call_analysis}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-call_analysis} -d ${DB_NAME:-call_analysis}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - call-analysis-network

  redis:
    image: redis:7-alpine
    container_name: call-analysis-redis
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - call-analysis-network

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: call-analysis-api
    environment:
      - ENVIRONMENT=production
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${DB_USER:-call_analysis}
      - DB_PASSWORD=${DB_PASSWORD:-changeme}
      - DB_NAME=${DB_NAME:-call_analysis}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - NVIDIA_API_KEY=${NVIDIA_API_KEY}
      - NVIDIA_BASE_URL=${NVIDIA_BASE_URL:-https://integrate.api.nvidia.com/v1}
      - NVIDIA_MODEL=${NVIDIA_MODEL:-meta/llama-3.1-8b-instruct}
      - AUTH_SECRET_KEY=${AUTH_SECRET_KEY}
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=8787
      - SERVER_WORKERS=4
      - LOG_LEVEL=INFO
      - LOG_FORMAT=json
      - OTEL_ENABLED=true
      - OTEL_EXPORTER_ENDPOINT=http://otel-collector:4317
    volumes:
      - ./data:/app/data
    ports:
      - "8787:8787"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - call-analysis-network
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
        reservations:
          cpus: "1"
          memory: 1G

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: call-analysis-worker
    command: call-worker
    environment:
      - ENVIRONMENT=production
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${DB_USER:-call_analysis}
      - DB_PASSWORD=${DB_PASSWORD:-changeme}
      - DB_NAME=${DB_NAME:-call_analysis}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - NVIDIA_API_KEY=${NVIDIA_API_KEY}
      - NVIDIA_BASE_URL=${NVIDIA_BASE_URL:-https://integrate.api.nvidia.com/v1}
      - NVIDIA_MODEL=${NVIDIA_MODEL:-meta/llama-3.1-8b-instruct}
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - LOG_LEVEL=INFO
      - LOG_FORMAT=json
      - OTEL_ENABLED=true
      - OTEL_EXPORTER_ENDPOINT=http://otel-collector:4317
    volumes:
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - call-analysis-network
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "2"
          memory: 2G
        reservations:
          cpus: "1"
          memory: 1G

  beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: call-analysis-beat
    command: celery -A call_analysis.celery_app beat --loglevel=INFO --scheduler celery.beat.PersistentScheduler
    environment:
      - ENVIRONMENT=production
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${DB_USER:-call_analysis}
      - DB_PASSWORD=${DB_PASSWORD:-changeme}
      - DB_NAME=${DB_NAME:-call_analysis}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - LOG_LEVEL=INFO
      - LOG_FORMAT=json
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - call-analysis-network

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.112.0
    container_name: call-analysis-otel
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./otel-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "4317:4317"  # OTLP gRPC
      - "4318:4318"  # OTLP HTTP
      - "8888:8888"  # Prometheus metrics
    networks:
      - call-analysis-network

  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: call-analysis-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - call-analysis-network

  grafana:
    image: grafana/grafana:11.0.0
    container_name: call-analysis-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - call-analysis-network

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:

networks:
  call-analysis-network:
    driver: bridge