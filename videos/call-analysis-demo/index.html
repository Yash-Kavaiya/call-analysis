<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js" integrity="sha384-sG0Hv1tP1lZCk9KQmrIbY/XNwi+OY84GQqhMscbnsoBFqAz8KNCil1kvfL3Hbbk2" crossorigin="anonymous"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #e8e8ef;
      }
      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="90"
      data-width="1920"
      data-height="1080"
    >
      <div
        id="el-01-hook"
        class="scene"
        data-composition-id="01-hook"
        data-composition-src="compositions/frames/01-hook.html"
        data-start="0"
        data-duration="6.4"
        data-track-index="0"
      ></div>
      <audio
        id="el-01-hook-voice"
        src="assets/voice/01.wav"
        data-start="0"
        data-duration="6"
        data-track-index="10"
        data-volume="1"
      ></audio>

      <div
        id="el-02-pipeline"
        class="scene"
        data-composition-id="02-pipeline"
        data-composition-src="compositions/frames/02-pipeline.html"
        data-start="6"
        data-duration="13.5"
        data-track-index="1"
      ></div>
      <audio
        id="el-02-pipeline-voice"
        src="assets/voice/02.wav"
        data-start="6"
        data-duration="13"
        data-track-index="10"
        data-volume="1"
      ></audio>

      <div
        id="el-03-ingest"
        class="scene"
        data-composition-id="03-ingest"
        data-composition-src="compositions/frames/03-ingest.html"
        data-start="19"
        data-duration="12.5"
        data-track-index="0"
      ></div>
      <audio
        id="el-03-ingest-voice"
        src="assets/voice/03.wav"
        data-start="19"
        data-duration="12"
        data-track-index="10"
        data-volume="1"
      ></audio>

      <div
        id="el-04-diarization-pii"
        class="scene"
        data-composition-id="04-diarization-pii"
        data-composition-src="compositions/frames/04-diarization-pii.html"
        data-start="31"
        data-duration="12.5"
        data-track-index="1"
      ></div>
      <audio
        id="el-04-diarization-pii-voice"
        src="assets/voice/04.wav"
        data-start="31"
        data-duration="12"
        data-track-index="10"
        data-volume="1"
      ></audio>

      <div
        id="el-05-agents"
        class="scene"
        data-composition-id="05-agents"
        data-composition-src="compositions/frames/05-agents.html"
        data-start="43"
        data-duration="15.4"
        data-track-index="0"
      ></div>
      <audio
        id="el-05-agents-voice"
        src="assets/voice/05.wav"
        data-start="43"
        data-duration="15"
        data-track-index="10"
        data-volume="1"
      ></audio>

      <div
        id="el-06-dashboard"
        class="scene"
        data-composition-id="06-dashboard"
        data-composition-src="compositions/frames/06-dashboard.html"
        data-start="58"
        data-duration="12.5"
        data-track-index="1"
      ></div>
      <audio
        id="el-06-dashboard-voice"
        src="assets/voice/06.wav"
        data-start="58"
        data-duration="12"
        data-track-index="10"
        data-volume="1"
      ></audio>

      <div
        id="el-07-copilot"
        class="scene"
        data-composition-id="07-copilot"
        data-composition-src="compositions/frames/07-copilot.html"
        data-start="70"
        data-duration="10.5"
        data-track-index="0"
      ></div>
      <audio
        id="el-07-copilot-voice"
        src="assets/voice/07.wav"
        data-start="70"
        data-duration="10"
        data-track-index="10"
        data-volume="1"
      ></audio>

      <div
        id="el-08-cta"
        class="scene"
        data-composition-id="08-cta"
        data-composition-src="compositions/frames/08-cta.html"
        data-start="80"
        data-duration="10"
        data-track-index="1"
      ></div>
      <audio
        id="el-08-cta-voice"
        src="assets/voice/08.wav"
        data-start="80"
        data-duration="10"
        data-track-index="10"
        data-volume="1"
      ></audio>

      <!-- BGM -->
      <audio
        id="el-bgm"
        src="assets/music/bgm.mp3"
        data-start="0"
        data-duration="90"
        data-track-index="11"
        data-volume="0.16"
      ></audio>

      <!-- captions -->
      <div
        id="el-captions"
        class="scene"
        data-composition-id="captions"
        data-composition-src="compositions/captions.html"
        data-start="0"
        data-duration="90"
        data-track-index="2"
      ></div>

    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
      // ── frame transitions (injected by transitions.mjs) ──
      (function () { var tl = window.__timelines["main"];
        tl.to("#el-01-hook", { scale: 2.5, opacity: 0, filter: "blur(8px)", duration: 0.4, ease: "power3.in" }, 6);
        tl.fromTo("#el-02-pipeline", { scale: 0.5, opacity: 0, filter: "blur(8px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.4, ease: "power3.out" }, 6);
        tl.to("#el-02-pipeline", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 19);
        tl.fromTo("#el-03-ingest", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 19);
        tl.to("#el-03-ingest", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 31);
        tl.fromTo("#el-04-diarization-pii", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 31);
        tl.to("#el-04-diarization-pii", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 43);
        tl.fromTo("#el-05-agents", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 43);
        tl.to("#el-05-agents", { scale: 2.5, opacity: 0, filter: "blur(8px)", duration: 0.4, ease: "power3.in" }, 58);
        tl.fromTo("#el-06-dashboard", { scale: 0.5, opacity: 0, filter: "blur(8px)" }, { scale: 1, opacity: 1, filter: "blur(0px)", duration: 0.4, ease: "power3.out" }, 58);
        tl.to("#el-06-dashboard", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 70);
        tl.fromTo("#el-07-copilot", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 70);
        tl.to("#el-07-copilot", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 80);
        tl.fromTo("#el-08-cta", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 80);
        tl.to({}, { duration: 90 }, 0); // full-span anchor — main.duration() == composition total (Studio master duration)
      })();
    </script>
  </body>
</html>
